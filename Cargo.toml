[package]
name = "esp32-s3-minetest"
version = "0.1.0"
authors = ["Keir Finlow-Bates <keir@chainfrog.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"
description = "Minetest Game on a stick: a Luanti server for the ESP32-S3 with the game built in"
license = "MIT"
readme = "README.md"

[[bin]]
name = "esp32-s3-minetest"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf.git" }

[dependencies]
log = "0.4"
esp-idf-svc = "0.53"
anyhow = "1"
# The Join page's Wi-Fi QR code (pure Rust, no dependencies).
qrcodegen = "1.8"

[build-dependencies]
embuild = "0.33.5"

# The USB drive (see usb_drive in src/main.rs): Espressif's TinyUSB
# component, fetched by ESP-IDF's component manager when building. The 1.x
# releases, whose mass storage API the code uses. esp-idf-sys's own
# bindings take in its headers once it is there (see BINDGEN_EXTRA_CLANG_ARGS
# in .cargo/config.toml).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_tinyusb", version = "~1.7.0" }
